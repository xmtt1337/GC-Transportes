<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>GC — Diagnóstico de tela</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- O MESMO style.css do site, com o mesmo ?v=, pra medir o CSS de verdade que
     o aparelho está usando — inclusive se for uma cópia velha presa no cache. -->
<link rel="stylesheet" href="style.css?v=20260906a">

<style>
    /* Esta página não usa a casca do app: o body do style.css é flex/100svh e
       esconderia o relatório. Aqui ele volta a ser uma página normal que rola. */
    html, body {
        display: block !important; height: auto !important;
        overflow: visible !important; margin: 0; padding: 0;
        background: #0b0f18 !important; color: #e2e8f0;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    .d-wrap { padding: 16px 14px 40px; max-width: 720px; margin: 0 auto; }
    .d-titulo { font-size: 19px; font-weight: 700; margin: 0 0 4px; }
    .d-sub { font-size: 13px; color: #8494a9; margin: 0 0 18px; line-height: 1.5; }
    .d-linha {
        display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
        padding: 9px 12px; border-radius: 8px; margin-bottom: 4px;
        background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.07);
    }
    .d-rot { font-size: 12.5px; color: #8494a9; flex-shrink: 0; }
    .d-val {
        font-size: 15px; font-weight: 700; text-align: right;
        font-variant-numeric: tabular-nums; word-break: break-word;
    }
    .d-ok   { color: #22c55e; }
    .d-mal  { color: #ef4444; }
    .d-att  { color: #fb923c; }
    .d-secao {
        font-size: 11px; font-weight: 700; text-transform: uppercase;
        letter-spacing: 0.1em; color: #3a86ff; margin: 20px 0 8px;
    }
    .d-veredito {
        border-radius: 12px; padding: 14px 16px; margin: 18px 0 6px;
        font-size: 14.5px; font-weight: 600; line-height: 1.5;
    }
    .d-veredito.bom  { background: rgba(34,197,94,0.10);  border: 1px solid rgba(34,197,94,0.35); color: #4ade80; }
    .d-veredito.ruim { background: rgba(239,68,68,0.10);  border: 1px solid rgba(239,68,68,0.35); color: #f87171; }
    /* O clone do menu serve pra MEDIR o drawer de verdade, com o CSS de verdade.
       Tirar da tela com left:-9999px NAO funciona: o .sidebar e position:fixed e
       escapa do pai, indo parar por cima do relatorio. E transform no pai seria
       pior ainda — viraria o bloco de contencao do fixed e falsearia justamente
       a medida que interessa. visibility:hidden esconde sem tocar no layout. */
    #d-palco .sidebar { visibility: hidden; pointer-events: none; }
</style>
</head>
<body>

<div class="d-wrap">
    <h1 class="d-titulo">Diagnóstico de tela — GC</h1>
    <p class="d-sub">
        Tire um print desta tela inteira e mande. Ela mede o que o navegador
        <em>deste aparelho</em> está realmente fazendo — nenhuma informação sai daqui.
    </p>
    <div id="d-saida"></div>
</div>

<!-- Clone do menu lateral, medido com o style.css real -->
<div id="d-palco">
    <nav class="sidebar expanded" id="d-sidebar">
        <div class="logo"><img src="img/logobranca2.png" alt="" class="logo-img"></div>
        <ul class="menu">
            <li class="menu-item"><svg class="menu-icon" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/></svg><span class="label">Fechamentos</span><span class="arrow">&#9662;</span></li>
            <li class="menu-item"><svg class="menu-icon" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/></svg><span class="label">Adiantamentos</span><span class="arrow">&#9662;</span></li>
            <li class="menu-item"><svg class="menu-icon" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/></svg><span class="label">Confer&ecirc;ncia</span><span class="arrow">&#9662;</span></li>
            <li class="menu-item"><svg class="menu-icon" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/></svg><span class="label">Atribui&ccedil;&otilde;es</span><span class="arrow">&#9662;</span></li>
            <li class="menu-item"><svg class="menu-icon" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/></svg><span class="label">Baixas</span><span class="arrow">&#9662;</span></li>
            <li class="menu-item"><svg class="menu-icon" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/></svg><span class="label">Devolu&ccedil;&otilde;es</span><span class="arrow">&#9662;</span></li>
            <li class="menu-item"><svg class="menu-icon" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/></svg><span class="label">Ocorr&ecirc;ncias</span><span class="arrow">&#9662;</span></li>
        </ul>
        <div class="sidebar-footer">
            <button class="sidebar-reload-btn"><span>Atualizar</span></button>
        </div>
    </nav>
</div>

<!-- Sonda de tamanho de texto: 14px declarado. Se o Chrome inflar a fonte
     (Text Autosizing / escalonamento de acessibilidade), o medido vem maior. -->
<span id="d-sonda" style="position:absolute;left:-9999px;font-size:14px">M</span>

<script>
(function () {
    var out = [];

    function secao(t) { out.push('<div class="d-secao">' + t + '</div>'); }
    function linha(rot, val, classe) {
        out.push('<div class="d-linha"><span class="d-rot">' + rot + '</span>'
               + '<span class="d-val ' + (classe || '') + '">' + val + '</span></div>');
    }

    // ── viewport ────────────────────────────────────────────────────────────
    var iw = window.innerWidth, ih = window.innerHeight;
    var mobile = window.matchMedia('(max-width: 680px)').matches;

    secao('Viewport');
    linha('innerWidth &times; innerHeight', iw + ' &times; ' + ih);
    linha('screen', screen.width + ' &times; ' + screen.height);
    linha('devicePixelRatio', String(window.devicePixelRatio));
    if (window.visualViewport) {
        var vv = window.visualViewport;
        linha('visualViewport', Math.round(vv.width) + ' &times; ' + Math.round(vv.height)
              + ' (escala ' + vv.scale.toFixed(2) + ')');
    }

    // A pergunta que decide tudo: o bloco @media do celular está valendo?
    linha('@media (max-width: 680px)', mobile ? 'ATIVO' : 'DESLIGADO',
          mobile ? 'd-ok' : 'd-mal');

    // ── unidades de altura ──────────────────────────────────────────────────
    function mede(unidade) {
        var d = document.createElement('div');
        d.style.cssText = 'position:absolute;left:-9999px;height:100' + unidade;
        document.body.appendChild(d);
        var h = d.getBoundingClientRect().height;
        document.body.removeChild(d);
        return Math.round(h);
    }
    secao('Unidades de altura');
    var svh = mede('svh'), lvh = mede('lvh'), dvh = mede('dvh'), vh = mede('vh');
    linha('100vh', vh + 'px');
    linha('100svh', svh + 'px');
    linha('100lvh', lvh + 'px');
    linha('100dvh', dvh + 'px');
    linha('barra do navegador ocupa', (lvh - svh) + 'px', (lvh - svh) > 0 ? 'd-att' : '');

    // ── tamanho de texto ────────────────────────────────────────────────────
    secao('Texto');
    var medido = parseFloat(getComputedStyle(document.getElementById('d-sonda')).fontSize);
    var inflou = Math.abs(medido - 14) > 0.6;
    linha('14px declarado, medido', medido.toFixed(1) + 'px',
          inflou ? 'd-mal' : 'd-ok');
    if (inflou) linha('fonte inflada em', (medido / 14).toFixed(2) + '&times;', 'd-mal');

    // ── o drawer de verdade ─────────────────────────────────────────────────
    secao('Menu lateral (medido)');
    var sb = document.getElementById('d-sidebar');
    var r  = sb.getBoundingClientRect();
    var cs = getComputedStyle(sb);
    var rodape = sb.querySelector('.sidebar-footer').getBoundingClientRect();

    linha('position', cs.position, cs.position === 'fixed' ? 'd-ok' : 'd-mal');
    linha('largura', Math.round(r.width) + 'px');
    linha('altura', Math.round(r.height) + 'px');
    var bate = Math.abs(r.height - ih) <= 2;
    linha('altura = viewport?', bate ? 'SIM' : 'NAO (' + Math.round(ih - r.height) + 'px a menos)',
          bate ? 'd-ok' : 'd-mal');
    linha('top / bottom', cs.top + ' / ' + cs.bottom);
    linha('rodape "Atualizar" em y', Math.round(rodape.top) + 'px');
    var rodapeOk = rodape.top >= 0 && rodape.bottom <= ih + 2;
    linha('rodape dentro da tela?', rodapeOk ? 'SIM' : 'NAO', rodapeOk ? 'd-ok' : 'd-mal');

    var itens = sb.querySelectorAll('.menu-item');
    var visiveis = 0;
    for (var i = 0; i < itens.length; i++) {
        var ri = itens[i].getBoundingClientRect();
        if (ri.top >= r.top - 1 && ri.bottom <= r.bottom + 1) visiveis++;
    }
    linha('itens que cabem no menu', visiveis + ' de ' + itens.length,
          visiveis === itens.length ? 'd-ok' : 'd-att');

    // ── CSS carregado ───────────────────────────────────────────────────────
    secao('CSS em uso');
    var href = '(nao achei)';
    for (var k = 0; k < document.styleSheets.length; k++) {
        var h = document.styleSheets[k].href || '';
        if (h.indexOf('style.css') !== -1) { href = h.split('/').pop(); break; }
    }
    linha('arquivo', href);
    // Marcadores de conteudo: provam qual VERSAO do CSS chegou, nao so a URL.
    var temWillChange = false, temSvh = false;
    try {
        for (var a = 0; a < document.styleSheets.length; a++) {
            var ss = document.styleSheets[a];
            if (!ss.href || ss.href.indexOf('style.css') === -1) continue;
            var txt = '';
            for (var b = 0; b < ss.cssRules.length; b++) txt += ss.cssRules[b].cssText;
            temWillChange = txt.indexOf('will-change') !== -1;
            temSvh = txt.indexOf('svh') !== -1;
        }
    } catch (e) { /* cssRules pode barrar; os dois ficam false */ }
    linha('tem correcao "will-change"', temWillChange ? 'SIM' : 'NAO',
          temWillChange ? 'd-ok' : 'd-mal');
    linha('tem correcao "svh"', temSvh ? 'SIM' : 'NAO', temSvh ? 'd-ok' : 'd-mal');

    // ── modo escuro automatico ──────────────────────────────────────────────
    secao('Tema');
    linha('prefers-color-scheme: dark',
          window.matchMedia('(prefers-color-scheme: dark)').matches ? 'SIM' : 'NAO');
    linha('color-scheme no :root',
          getComputedStyle(document.documentElement).colorScheme || '(nenhum)');

    secao('Navegador');
    linha('userAgent', navigator.userAgent);

    // ── veredito ────────────────────────────────────────────────────────────
    var problemas = [];
    if (!mobile) problemas.push('o CSS de celular nao esta valendo nesta largura');
    if (!bate) problemas.push('o menu lateral nao esta com a altura da tela');
    if (!rodapeOk) problemas.push('o rodape do menu caiu fora da tela');
    if (inflou) problemas.push('o navegador esta inflando o tamanho da fonte');
    if (!temWillChange) problemas.push('o CSS aqui e uma copia ANTIGA, presa no cache');

    var v = problemas.length
        ? '<div class="d-veredito ruim">Achei: ' + problemas.join('; ') + '.</div>'
        : '<div class="d-veredito bom">Tudo dentro do esperado nesta tela. '
          + 'Se o menu ainda abre cortado, o problema nao esta no layout — mande o print junto deste.</div>';

    document.getElementById('d-saida').innerHTML = v + out.join('');
}());
</script>
</body>
</html>
