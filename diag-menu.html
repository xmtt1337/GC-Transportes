<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>GC — Teste do menu</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="stylesheet" href="style.css?v=20260908a">

<!-- Casca REAL do app: mesmo body flex, mesmo 100svh, mesmo overflow hidden,
     mesmo drawer fixed com transition de transform. Nada sobrescrito.

     Duas coisas que a versão anterior desta página não fazia, e que eram
     justamente as que faltavam:

     1. Os itens do menu nascem escondidos e só aparecem depois, por JavaScript —
        igual ao app de verdade, onde core.js revela os itens do cargo só quando
        a API responde. A página anterior já vinha com tudo visível no HTML, e
        por isso nunca reproduziria um defeito ligado a esse momento.

     2. O teste roda SOZINHO: abre e fecha o menu várias vezes e mede a cada
        quadro, guardando o pior valor. Antes dependia de alguém lembrar de
        tocar no botão — e o primeiro print voltou sem o menu ter sido aberto.

     E faz um A/B do will-change que eu mesmo adicionei numa rodada anterior,
     com base numa teoria que depois se mostrou errada: metade dos ciclos roda
     com ele, metade sem. Se os números diferirem, a culpa é minha e eu removo. -->
<style>
    #t-painel {
        position: fixed; left: 0; right: 0; bottom: 0; z-index: 99999;
        background: #000; border-top: 3px solid #3a86ff; padding: 10px 12px 14px;
        font: 700 13px/1.5 ui-monospace, Menlo, Consolas, monospace; color: #e2e8f0;
    }
    #t-fase { font-size: 12px; color: #8494a9; font-weight: 400; }
    #t-veredito { font-size: 15px; margin-top: 6px; }
    .ok  { color: #22c55e; }
    .mal { color: #ef4444; }
    .att { color: #fb923c; }
</style>
</head>
<body>

<nav class="sidebar" id="sidebar">
    <div class="logo"><img src="img/logobranca2.png" alt="" class="logo-img"></div>
    <ul class="menu" id="t-menu">
        <!-- "Admin": visíveis de saída, escondidos depois — igual ao app real -->
        <li class="menu-item t-adm"><svg class="menu-icon" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/></svg><span class="label">Opera&ccedil;&atilde;o</span><span class="arrow">&#9662;</span></li>
        <li class="menu-item t-adm"><svg class="menu-icon" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/></svg><span class="label">Shopee</span><span class="arrow">&#9662;</span></li>
        <li class="menu-item t-adm"><svg class="menu-icon" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/></svg><span class="label">Pedidos</span><span class="arrow">&#9662;</span></li>
        <li class="menu-item t-adm"><svg class="menu-icon" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/></svg><span class="label">Confer&ecirc;ncias</span><span class="arrow">&#9662;</span></li>
        <li class="menu-item t-adm"><svg class="menu-icon" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/></svg><span class="label">Cust&oacute;dia</span><span class="arrow">&#9662;</span></li>

        <!-- "Entregador": nascem escondidos, revelados por JS -->
        <li class="menu-item t-ent" style="display:none"><svg class="menu-icon" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg><span class="label">Fechamentos</span><span class="arrow">&#9662;</span></li>
        <li class="menu-item t-ent" style="display:none"><svg class="menu-icon" viewBox="0 0 24 24"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg><span class="label">Adiantamentos</span><span class="arrow">&#9662;</span></li>
        <li class="menu-item t-ent" style="display:none"><svg class="menu-icon" viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg><span class="label">Confer&ecirc;ncia</span><span class="arrow">&#9662;</span></li>
        <li class="menu-item t-ent" style="display:none"><svg class="menu-icon" viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg><span class="label">Baixas</span><span class="arrow">&#9662;</span></li>
        <li class="menu-item t-ent" style="display:none"><svg class="menu-icon" viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg><span class="label">Devolu&ccedil;&otilde;es</span><span class="arrow">&#9662;</span></li>
        <li class="menu-item t-ent" style="display:none"><svg class="menu-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/></svg><span class="label">Ocorr&ecirc;ncias</span><span class="arrow">&#9662;</span></li>
    </ul>
    <div class="sidebar-footer">
        <button class="sidebar-reload-btn"><span>Atualizar</span></button>
        <button class="hamburger-btn">&#8249;</button>
    </div>
</nav>

<div class="sidebar-backdrop" id="sidebar-backdrop"></div>

<div class="content">
    <div class="topbar">
        <div class="topbar-left">
            <button class="topbar-mobile-menu" aria-label="Menu"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
            <h1>Teste autom&aacute;tico</h1>
        </div>
    </div>
    <div class="main">
        <div id="tela-home" class="view active-view">
            <div class="home-container">
                <div class="home-eyebrow">Painel de Controle</div>
                <div class="home-greeting">Teste</div>
                <div class="home-role-badge"><span class="role-dot" style="background:#22c55e"></span>Entregador</div>
                <div class="home-actions" id="t-cartoes"></div>
            </div>
        </div>
    </div>
</div>

<div id="t-painel">
    <div id="t-fase">preparando&hellip;</div>
    <div id="t-medida">&nbsp;</div>
    <div id="t-veredito">&nbsp;</div>
</div>

<script>
(function () {
    var sb   = document.getElementById('sidebar');
    var bd   = document.getElementById('sidebar-backdrop');
    var fase = document.getElementById('t-fase');
    var med  = document.getElementById('t-medida');
    var ver  = document.getElementById('t-veredito');

    var c = '';
    for (var i = 0; i < 5; i++) {
        c += '<div class="home-action-card" style="--ac:#3a86ff">'
           + '<div class="hac-icon" style="background:rgba(58,134,255,0.12)"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/></svg></div>'
           + '<div class="hac-body"><div class="hac-title">Cart&atilde;o ' + (i + 1) + '</div>'
           + '<div class="hac-desc">Conte&uacute;do de teste.</div></div>'
           + '<div class="hac-go">Abrir &rarr;</div></div>';
    }
    document.getElementById('t-cartoes').innerHTML = c;

    // ── troca de itens igual ao core.js: some o "admin", aparece o "entregador"
    setTimeout(function () {
        var f = document.querySelectorAll('.t-adm');
        for (var i = 0; i < f.length; i++) f[i].style.display = 'none';
        var e = document.querySelectorAll('.t-ent');
        for (var j = 0; j < e.length; j++) e[j].style.display = '';
    }, 700);

    // ── medição contínua, guardando o pior por fase ─────────────────────────
    var faseAtual = 'com', pior = { com: 0, sem: 0 }, medindo = false;

    function quadro() {
        var ih = window.innerHeight;
        var r  = sb.getBoundingClientRect();
        var falta = Math.round(ih - r.height);
        if (medindo && falta > pior[faseAtual]) pior[faseAtual] = falta;
        med.innerHTML = 'tela ' + window.innerWidth + 'x' + ih
                      + '  menu ' + Math.round(r.width) + 'x' + Math.round(r.height)
                      + (medindo ? '  <span class="att">medindo</span>' : '');
        requestAnimationFrame(quadro);
    }
    requestAnimationFrame(quadro);

    function espera(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

    async function ciclo(n, total) {
        fase.textContent = 'ciclo ' + n + ' de ' + total + '  —  '
                         + (faseAtual === 'com' ? 'COM will-change' : 'SEM will-change');
        sb.classList.add('expanded'); bd.classList.add('active');
        medindo = true;
        await espera(700);
        sb.classList.remove('expanded'); bd.classList.remove('active');
        await espera(500);
        medindo = false;
        await espera(150);
    }

    async function rodar() {
        await espera(1200);

        faseAtual = 'com';
        sb.style.willChange = '';           // vale o que o style.css manda
        for (var i = 1; i <= 4; i++) await ciclo(i, 4);

        faseAtual = 'sem';
        sb.style.willChange = 'auto';       // desliga a promoção antecipada
        for (var j = 1; j <= 4; j++) await ciclo(j, 4);

        sb.style.willChange = '';
        fase.textContent = 'terminado — mande o print desta faixa';

        var linha = function (rot, v) {
            var cls = v <= 2 ? 'ok' : 'mal';
            return rot + ': <span class="' + cls + '">'
                 + (v <= 2 ? 'sem falha' : 'faltou ' + v + 'px') + '</span>';
        };
        ver.innerHTML = linha('COM will-change', pior.com) + '<br>'
                      + linha('SEM will-change', pior.sem);
    }
    rodar();
}());
</script>
</body>
</html>
