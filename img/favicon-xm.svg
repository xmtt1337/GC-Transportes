<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160">
  <!-- Favicon do monograma XM.
       O fundo é transparente, então a cor da tinta é que precisa acompanhar o navegador:
       aba clara pede logo escuro, aba escura pede logo claro. Um PNG só não resolve isso —
       seja qual for a cor escolhida, ele some para metade das pessoas.
       Aqui a silhueta é uma máscara e a cor vem do CSS, que ouve o tema do sistema. -->
  <style>
    .xm { fill: #32475a; }
    @media (prefers-color-scheme: dark) { .xm { fill: #ffffff; } }
  </style>
  <mask id="xm-mask">
    <image href="data:image/png;base64," width="160" height="160"/>
  </mask>
  <rect class="xm" width="160" height="160" mask="url(#xm-mask)"/>
</svg>
