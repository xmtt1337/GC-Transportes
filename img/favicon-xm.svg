<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160">
  <!-- Favicon do monograma XM, sem fundo.
       A silhueta e uma mascara e a cor vem do CSS: aba clara pede tinta escura, aba escura
       pede tinta clara, e um PNG de cor fixa sumiria para metade das pessoas.
       O logo encosta nas bordas laterais — nao ha respiro sobrando. A altura fica em 53%
       porque a marca e 1,89x mais larga que alta, e a aba e quadrada; esticar para preencher
       deformaria as letras. -->
  <style>
    .xm { fill: #32475a; }
    @media (prefers-color-scheme: dark) { .xm { fill: #ffffff; } }
  </style>
  <mask id="xm-mask">
    <image href="data:image/png;base64," width="160" height="160"/>
  </mask>
  <rect class="xm" width="160" height="160" mask="url(#xm-mask)"/>
</svg>
