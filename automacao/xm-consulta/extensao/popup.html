<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>XM Consulta</title>
<style>
  body { width: 280px; margin: 0; padding: 14px; background: #16181d; color: #e8eaed; font: 13px system-ui, sans-serif; }
  h1 { font-size: 15px; margin: 0 0 10px; }
  p { margin: 0 0 10px; color: #a8adb7; line-height: 1.4; }
  label { display: block; margin-bottom: 4px; }
  input { box-sizing: border-box; width: 100%; padding: 7px; background: #0f1115; color: #e8eaed; border: 1px solid #3a3f4a; border-radius: 4px; }
  button { margin-top: 8px; padding: 0; background: none; border: 0; color: #6ea8fe; font: inherit; cursor: pointer; }
  button:hover { text-decoration: underline; }
  .ligado { color: #4ade80; }
</style>
</head>
<body>
  <h1>XM Consulta</h1>
  <p id="estado">Verificando...</p>
  <label for="chave">Chave do programa</label>
  <input id="chave" type="password" autocomplete="off" spellcheck="false">
  <button id="salvar" type="button">Salvar chave</button>
  <script src="popup.js"></script>
</body>
</html>
