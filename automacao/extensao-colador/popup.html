<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <style>
    body { width: 260px; font-family: "Segoe UI", sans-serif; padding: 14px; margin: 0; }
    h1 { font-size: 15px; color: #2c7be5; margin: 0 0 10px; }
    p  { font-size: 12px; color: #444; line-height: 1.5; margin: 0 0 8px; }
    code { background: #f0f4fa; padding: 1px 4px; border-radius: 3px; font-size: 11px; }
    .dica { color: #7a8aa0; font-size: 11px; border-top: 1px solid #e6ecf5; padding-top: 8px; }
  </style>
</head>
<body>
  <h1>GC Colador — ponte SPX</h1>
  <p>Esta extensão recebe os códigos do <b>ColadorNeon</b> e escreve no campo do SPX.</p>
  <p>Deixe a aba do SPX aberta na tela de bipagem. Não precisa ficar em foco.</p>
  <p class="dica">
    Conecta em <code>ws://127.0.0.1:9876</code>.<br>
    Se não colar nada: confira se o ColadorNeon está aberto e com a saída
    <b>Navegador</b> selecionada.
  </p>
</body>
</html>
