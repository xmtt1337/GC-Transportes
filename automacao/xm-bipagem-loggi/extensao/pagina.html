<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>XM - Bipagem Loggi</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #16181d; color: #e8eaed; font: 14px/1.4 system-ui, sans-serif; }
  main { padding: 12px 14px 16px; }
  [hidden] { display: none !important; }
  label.campo { display: block; margin: 14px 0 4px; color: #a8adb7; font-size: 13px; }
  input[type=text], input[type=password], input[type=search], input:not([type]) {
    width: 100%; padding: 8px 10px; background: #0f1115; color: #e8eaed;
    border: 1px solid #3a3f4a; border-radius: 4px; font: inherit; outline: none;
  }
  input:focus { border-color: #6ea8fe; }
  button { margin: 0; padding: 0; background: none; border: 0; color: #6ea8fe; font: inherit; font-weight: 600; cursor: pointer; white-space: nowrap; }
  button:hover:not(:disabled) { text-decoration: underline; }
  button:disabled { color: #6b7280; cursor: default; }

  .topo { display: flex; justify-content: space-between; align-items: center; color: #a8adb7; gap: 12px; }
  .topo span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .abas { display: flex; gap: 20px; margin: 10px 0 12px; border-bottom: 1px solid #2a2e37; }
  .abas button { padding: 7px 0; color: #a8adb7; border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .abas button.ativa { color: #e8eaed; border-bottom-color: #6ea8fe; }
  .abas button:hover { text-decoration: none; color: #e8eaed; }

  .mensagem { color: #a8adb7; margin: 0 0 10px; font-size: 13px; }
  .mensagem:empty { display: none; }
  .erro { color: #f87171; }

  /* O que esta valendo agora */
  .alvo { padding: 10px 12px; border: 1px solid #2a2e37; background: #1d2128; border-radius: 4px; margin-bottom: 14px; }
  .alvo .rotulo { display: block; font-size: 12px; color: #4ade80; }
  .alvo.vazio .rotulo { color: #fbbf24; }
  .alvo strong { display: block; font-size: 15px; }
  .alvo small { display: block; color: #a8adb7; margin-top: 2px; }

  /* Circulo | Cidades */
  .modo { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); border: 1px solid #3a3f4a; border-radius: 4px; overflow: hidden; margin-bottom: 10px; }
  .modo button { padding: 7px 0; color: #a8adb7; text-align: center; }
  .modo button + button { border-left: 1px solid #3a3f4a; }
  .modo button.ativa { color: #e8eaed; background: #262b34; }
  .modo button:hover { text-decoration: none; color: #e8eaed; }

  .busca { position: relative; }
  .busca svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; fill: none; stroke: #a8adb7; stroke-width: 2; pointer-events: none; }
  .busca input { padding-left: 34px; }

  .cabecalho { display: flex; justify-content: space-between; align-items: center; margin: 12px 0 6px; }
  .cabecalho h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .5px; color: #a8adb7; margin: 0; font-weight: 600; }

  .lista { max-height: 300px; overflow: auto; scrollbar-width: thin; scrollbar-color: #3a3f4a transparent; border: 1px solid #2a2e37; border-radius: 4px; }
  .lista .vazia { padding: 12px; color: #a8adb7; }
  .item { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; align-items: center; column-gap: 10px; padding: 8px 10px; cursor: pointer; border-bottom: 1px solid #22262e; }
  .item:last-child { border-bottom: 0; }
  .item:hover { background: #1d2128; }
  .item input { margin: 0; width: 16px; height: 16px; accent-color: #6ea8fe; cursor: pointer; }
  .item .nome { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .nome small { display: block; color: #a8adb7; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .conta { color: #a8adb7; font-size: 12px; }

  /* Aba Circulos */
  .circulo { display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: 14px; align-items: start; padding: 10px 0; border-bottom: 1px solid #22262e; }
  .circulo strong { display: block; }
  .circulo small { display: block; color: #a8adb7; font-size: 12px; margin-top: 2px; }
  .circulo .acoes-linha { display: flex; gap: 14px; padding-top: 1px; }
  .rodape { display: flex; gap: 18px; margin-top: 12px; }
  .acoes { display: flex; gap: 18px; margin-top: 14px; }
</style>
</head>
<body>
<main>
  <form id="tela-login" hidden>
    <label class="campo" for="usuario">Usuário no sistema XMTT</label>
    <input id="usuario" autocomplete="username" required>
    <label class="campo" for="senha">Senha</label>
    <input id="senha" type="password" autocomplete="current-password" required>
    <div class="acoes"><button id="entrar" type="submit">Entrar</button></div>
    <p id="aviso-login" class="mensagem erro"></p>
  </form>

  <section id="tela-principal" hidden>
    <div class="topo"><span id="logado"></span><button id="sair" type="button">Sair</button></div>
    <div class="abas">
      <button type="button" data-aba="bipar" class="ativa">Bipar</button>
      <button type="button" data-aba="circulos">Círculos</button>
    </div>
    <p id="mensagem" class="mensagem"></p>

    <div id="aba-bipar">
      <div id="alvo" class="alvo"></div>
      <div class="modo">
        <button type="button" data-modo="grupos" class="ativa">Círculo</button>
        <button type="button" data-modo="cidades">Cidades</button>
      </div>
      <div class="busca">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
        <input id="busca" type="search" placeholder="Pesquisar círculo" autocomplete="off">
      </div>
      <div class="cabecalho"><h2 id="titulo-lista">Escolha um círculo</h2><button id="limpar" type="button">Remover marcados</button></div>
      <div id="lista" class="lista"></div>
    </div>

    <div id="aba-circulos" hidden>
      <div id="lista-circulos">
        <div id="grupos"></div>
        <div class="rodape"><button id="novo" type="button">Criar círculo</button><button id="atualizar" type="button">Atualizar</button></div>
      </div>
      <form id="form-grupo" hidden>
        <div class="cabecalho"><h2 id="titulo-form">Novo círculo</h2></div>
        <input id="nome-grupo" maxlength="60" placeholder="Nome do círculo" required>
        <div class="cabecalho"><h2>Cidades do círculo</h2><span id="conta-form" class="mensagem" style="margin:0"></span></div>
        <div class="busca">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
          <input id="busca-form" type="search" placeholder="Pesquisar cidade" autocomplete="off">
        </div>
        <div id="cidades-grupo" class="lista" style="margin-top:8px"></div>
        <div class="acoes"><button type="submit">Salvar</button><button id="cancelar" type="button">Cancelar</button></div>
      </form>
    </div>
  </section>
</main>
<script src="regras.js"></script>
<script src="pagina.js"></script>
</body>
</html>
